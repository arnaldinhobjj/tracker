# Supabase CLI configuration for DayLedger (local development with `supabase start`).
# Secrets are never stored here: values written as env(NAME) are read from the
# environment (or supabase/.env, which is gitignored) when the CLI runs.
# The hosted project is configured in the dashboard; see supabase/README.md.

project_id = "dayledger"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the Data API. Tables are granted explicitly in migrations.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Matches the sync page size used by the app (≤ 500 per request).
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
# Email links (confirmation, password recovery) open the app.
site_url = "dayledger://auth-callback"
additional_redirect_urls = ["dayledger://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 2
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

# Sign in with Apple. client_id is a comma-separated list: the iOS app's bundle id (native
# id_token flow) and, optionally, the Services ID used for web sign-in. The secret (a signed
# client-secret JWT) is only needed for the web OAuth flow; native id_token sign-in works without.
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

# Google (OAuth web client from Google Cloud Console, PKCE flow via ASWebAuthenticationSession).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false

# Edge Functions. Every function requires a valid user JWT except the App Store Server
# Notifications endpoint, which Apple calls without one (it verifies Apple's signature instead).
[functions.verify-subscription]
verify_jwt = true

[functions.entitlement]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.app-store-notifications]
verify_jwt = false
