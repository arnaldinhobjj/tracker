name: iOS build & test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Package unit tests (DayLedgerKit)
        working-directory: Packages/DayLedgerKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DayLedgerKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/package-tests.xcresult" \
            | tee "$RUNNER_TEMP/package-tests.log" 2>&1 | (grep -E "error:|warning: .*DayLedger|Test Case .* (passed|failed)|Executed|\*\* " || true)

      - name: Build app and run app + UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DayLedger.xcodeproj \
            -scheme DayLedger \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/app-tests.log" 2>&1 | (grep -E "error:|Test Case .* (passed|failed)|Executed|\*\* " || true)

      - name: Build for device (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DayLedger.xcodeproj \
            -scheme DayLedger \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/device-build.log" 2>&1 | (grep -E "error:|\*\* " || true)

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
