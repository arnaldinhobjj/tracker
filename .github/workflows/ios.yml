name: iOS build & test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen (pinned)
        # Pinned so every workflow generates the identical project. `brew install` kept whatever
        # version the runner image had, so two runners could disagree on the committed project.
        # To upgrade: change XCODEGEN_VERSION here and in the other workflow, regenerate, commit.
        env:
          XCODEGEN_VERSION: "2.47.0"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -q "${XCODEGEN_VERSION}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check committed Xcode project is up to date
        run: |
          # The project is committed; regenerating must not change it. If this fails,
          # run `xcodegen generate` and commit (the Sync Xcode project workflow does this).
          git status --porcelain -- DayLedger.xcodeproj App/Info.plist App/DayLedger.entitlements Widget/Info.plist Widget/DayLedgerWidget.entitlements
          git diff --exit-code -- DayLedger.xcodeproj App/Info.plist App/DayLedger.entitlements Widget/Info.plist Widget/DayLedgerWidget.entitlements
          test -z "$(git status --porcelain --untracked-files=all -- DayLedger.xcodeproj)"

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Package unit tests (DayLedgerKit)
        working-directory: Packages/DayLedgerKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DayLedgerKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/package-tests.xcresult" \
            | tee "$RUNNER_TEMP/package-tests.log" 2>&1 | (grep -E "error:|warning: .*DayLedger|Test Case .* (passed|failed)|Executed|\*\* " || true)

      - name: Build app and run app + UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DayLedger.xcodeproj \
            -scheme DayLedger \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/app-tests.log" 2>&1 | (grep -E "error:|Fatal error|crash|Restarting after|Test Case .* (passed|failed)|Executed|\*\* " || true)

      - name: Build for device (unsigned, Release) with a canary TrueLayer secret
        run: |
          set -o pipefail
          # A developer's Local.xcconfig may hold a sandbox secret. Plant a recognisable one and
          # prove below that Release builds never contain it.
          printf 'TRUELAYER_CLIENT_SECRET = dl-ci-canary-secret\n' > Config/Local.xcconfig
          xcodebuild build \
            -project DayLedger.xcodeproj \
            -scheme DayLedger \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/release-dd" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/device-build.log" 2>&1 | (grep -E "error:|\*\* " || true)

      - name: Release build contains no TrueLayer client secret
        run: |
          APP=$(find "$RUNNER_TEMP/release-dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          SECRET=$(/usr/libexec/PlistBuddy -c "Print :DLTrueLayerClientSecret" "$APP/Info.plist" 2>/dev/null || true)
          if [ -n "$SECRET" ]; then echo "::error::Release Info.plist contains DLTrueLayerClientSecret"; exit 1; fi
          if grep -R -a -q "dl-ci-canary-secret" "$APP"; then echo "::error::Release app bundle contains the client secret"; exit 1; fi
          if strings -a "$APP/DayLedger" | grep -q "DirectTrueLayerTokenExchanger"; then
            echo "::error::Release binary contains the Debug-only DirectTrueLayerTokenExchanger"; exit 1
          fi
          echo "No client secret in the Release build."
          rm -f Config/Local.xcconfig

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
